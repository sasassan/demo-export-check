name: Security audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (informational report)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=moderate
